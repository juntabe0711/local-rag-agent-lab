name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # テストは GPU・モデル・LLM を使わない (偽の埋め込み・偽の LLM で通しで確かめる)
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install faiss-cpu numpy pyyaml requests python-dotenv matplotlib fastapi pytest
      - name: Test
        run: pytest -q
