<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>local-rag-agent-lab</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="bar">
  <div class="brand">local-rag-agent-lab</div>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="chat" role="tab">RAG チャット</button>
    <button class="tab" data-tab="agent" role="tab">エージェント</button>
    <button class="tab" data-tab="search" role="tab">検索</button>
    <button class="tab" data-tab="eval" role="tab">評価</button>
  </nav>
  <div id="status" class="status" title="索引 / LLM / DB の状態">…</div>
</header>

<main>
  <section id="tab-chat" class="pane active">
    <div class="log" id="chat-log">
      <div class="hint">文書を検索して、その内容を根拠に答えます。例: 「CZ法で単結晶の酸素濃度はどう決まる？」</div>
    </div>
    <form class="composer" id="chat-form">
      <textarea id="chat-input" rows="2" placeholder="質問を入力 (Ctrl+Enter で送信)"></textarea>
      <div class="row">
        <label><input type="checkbox" id="chat-rag" checked> 文書を参照</label>
        <button type="button" class="ghost" id="chat-clear">会話を消す</button>
        <button type="submit">送信</button>
      </div>
    </form>
  </section>

  <section id="tab-agent" class="pane">
    <div class="log" id="agent-log">
      <div class="hint">エージェントが文書検索と読み取り専用の SQL で調べます。例:
        「9 月以降、LPD が増えている装置はある？ 原因は？」「装置別の LPD 平均の推移をグラフにして」</div>
    </div>
    <form class="composer" id="agent-form">
      <textarea id="agent-input" rows="2" placeholder="調べたいことを入力 (Ctrl+Enter で送信)"></textarea>
      <div class="row">
        <button type="button" class="ghost" id="agent-clear">会話を消す</button>
        <button type="submit">送信</button>
      </div>
    </form>
  </section>

  <section id="tab-search" class="pane">
    <form class="searchbar" id="search-form">
      <input id="search-input" placeholder="検索文 (LLM は使わず、2 段検索の結果だけを表示)">
      <input id="search-k" type="number" min="1" max="50" value="10" title="件数">
      <button type="submit">検索</button>
    </form>
    <div id="search-results"></div>
  </section>

  <section id="tab-eval" class="pane">
    <p class="hint">scripts/eval_rag.py run の記録。FILE@k (正しい文書が上位 k 件に入った割合) が主指標です。</p>
    <div id="eval-table"></div>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
